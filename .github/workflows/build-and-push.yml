name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths-ignore:
      - 'imageDetail.json'

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --tags
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LAST_TAG" ]; then
            NEW_VERSION="1.0.0"
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=%B)
            BUMP="patch"
            if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:|BREAKING CHANGE:'; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP="minor"
            fi
            VERSION_NO_V="${LAST_TAG#v}"
            MAJOR=$(echo "$VERSION_NO_V" | cut -d. -f1)
            MINOR=$(echo "$VERSION_NO_V" | cut -d. -f2)
            PATCH=$(echo "$VERSION_NO_V" | cut -d. -f3)
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          fi
          echo "Last tag: ${LAST_TAG:-none}, new version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::107737161507:role/github-actions-ecr-push-aws-ecs-app
          aws-region: us-east-1
          role-session-name: github-actions-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t 107737161507.dkr.ecr.us-east-1.amazonaws.com/aws-ecs-app:${{ steps.version.outputs.version }} .

      - name: Push image to ECR
        run: docker push 107737161507.dkr.ecr.us-east-1.amazonaws.com/aws-ecs-app:${{ steps.version.outputs.version }}

      - name: Record pushed image for pipeline deploy, and tag release
        run: |
          echo '{"ImageURI":"107737161507.dkr.ecr.us-east-1.amazonaws.com/aws-ecs-app:${{ steps.version.outputs.version }}"}' > imageDetail.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imageDetail.json
          git commit -m "chore: record pushed image for pipeline deploy (v${{ steps.version.outputs.version }})"
          git tag "v${{ steps.version.outputs.version }}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main && git push origin "v${{ steps.version.outputs.version }}"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing and retrying"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "Failed to push after 5 attempts"
          exit 1
